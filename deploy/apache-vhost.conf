# إعداد Apache (XAMPP) لسيرفر المعهد
# 1) أضف هذا المحتوى في آخر:  C:\xampp\apache\conf\extra\httpd-vhosts.conf
#    وللـ HTTPS في:              C:\xampp\apache\conf\extra\httpd-ssl.conf  (أو نفس الملف)
# 2) غيّر tracker.alrowad.edu.sa ومسارات الشهادة حسب المعهد
# 3) أعد تشغيل Apache من XAMPP Control Panel

<VirtualHost *:80>
    ServerName tracker.alrowad.edu.sa
    # كل طلبات HTTP تتحول إلى HTTPS (الحضور بالـ GPS لا يعمل بدون HTTPS)
    Redirect permanent / https://tracker.alrowad.edu.sa/
</VirtualHost>

<VirtualHost *:443>
    ServerName tracker.alrowad.edu.sa
    DocumentRoot "C:/xampp/htdocs/employee-tracker/public"

    <Directory "C:/xampp/htdocs/employee-tracker/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    "C:/xampp/apache/conf/ssl.crt/tracker.crt"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/tracker.key"

    ErrorLog  "logs/tracker-error.log"
    CustomLog "logs/tracker-access.log" common
</VirtualHost>
